#:schema node_modules/wrangler/config-schema.json
name = "cf-raw-mirror"
main = "_worker.js"
compatibility_date = "2026-10-01"

# 用法：
#   wrangler deploy          # 部署到 Workers
#   wrangler dev             # 本地调试
#
# 说明：文件名保持 _worker.js —— Cloudflare Pages 的 advanced mode 只认这个文件名，
#       所以同一份代码既能 wrangler deploy 到 Workers，又能被 Pages 直接接管。
#
# 绑定自定义域名（国内必做，*workers.dev 被 DNS 污染）：
#   面板 → Workers & Pages → 该 Worker → Settings → Domains & Routes
#
# 可选鉴权：取消下面两行注释并填一个随机串，之后请求需带 ?token=xxx
#   注意：「音源猎手」插件只做前缀拼接、带不了 token，给它用就别开。
# [vars]
# TOKEN = "换成你自己的随机字符串"
